  下段左     : 出力ファイル (PCの直下)

  戻り経路は上段ノード群の下を左方向へ:
    ⑧ SNS → ユーザー  (破線, y=350)  ← PC・入力ファイルの下を通る
    ⑨ S3出力 → 出力ファイル (実線, y=368) ← さらに下を通る
-->

