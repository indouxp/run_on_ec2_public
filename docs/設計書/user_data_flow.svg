     marker-end="url(#arrowhead)"
     id="path16" />
  <path
     class="line"
     d="M 310 250 V 280"
     marker-end="url(#arrowhead)"
     id="path17" />
  <path
     class="line"
     d="M 310 380 V 410"
     marker-end="url(#arrowhead)"
     id="path18" />
  <text
     class="line-label"
     x="330"
     y="395"
     id="text18">Yes</text>
  <path
     class="line"
     d="M 310 460 V 490"
     marker-end="url(#arrowhead)"
     id="path19" />
  <path
     class="line"
     d="M 430 540 H 490 V 620"
     marker-end="url(#arrowhead)"
     id="path20" />
  <text
     class="line-label"
     x="460"
     y="535"
     id="text20">Yes</text>
  <path
     class="line"
     d="M 190 540 H 130 V 620"
     marker-end="url(#arrowhead)"
     id="path21" />
  <text
     class="line-label"
     x="160"
     y="535"
     id="text21">No</text>
  <path
     class="line"
     d="M 130 670 V 700 H 310 V 730"
     marker-end="url(#arrowhead)"
     id="path22" />
  <path
     class="line"
     d="M 490 670 V 700 H 310"
     id="path23" />
  <path
     class="line"
     d="M 190.07015,330.06556 H 30.931258 V 759.93557 H 155.96896"
     marker-end="url(#arrowhead)"
     id="path24" />
  <text
     class="line-label"
     x="120"
     y="325"
     id="text24">No (致命的エラー)</text>
  <path
     class="line"
     d="M 310 790 V 820"
     marker-end="url(#arrowhead)"
     id="path25" />
  <path
     class="line"
     d="M 310 870 V 900"
     marker-end="url(#arrowhead)"
     id="path26" />
