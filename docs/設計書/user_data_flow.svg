     inkscape:current-layer="svg26" />
  <defs
     id="defs1">
    <style
       id="style1">
      .box { fill: #f0f4f8; stroke: #333; stroke-width: 1.5; }
      .diamond { fill: #e1f5fe; stroke: #333; stroke-width: 1.5; }
      .oval { fill: #e8f5e9; stroke: #333; stroke-width: 1.5; }
      .line { fill: none; stroke: #333; stroke-width: 1.5; }
      .text { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .line-label { font-size: 13px; text-anchor: middle; fill: #555; }
    </style>
    <marker
       id="arrowhead"
       viewBox="0 0 10 10"
       refX="5"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#333"
         id="path1" />
    </marker>
  </defs>
  <!-- Nodes -->
  <g
     id="start">
    <ellipse
       class="oval"
       cx="310"
       cy="40"
       rx="70"
       ry="30"
       id="ellipse1" />
    <text
       class="text"
       x="310"
       y="40"
       id="text1">開始</text>
  </g>
  <g
     id="init">
    <rect
       class="box"
       x="160"
       y="100"
       width="300"
       height="60"
       rx="5"
       id="rect1" />
    <text
       class="text"
       x="310"
       y="120"
