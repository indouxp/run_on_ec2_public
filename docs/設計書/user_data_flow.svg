    <text
       class="text"
       x="310"
       y="140"
       id="text3">セットアップ</text>
  </g>
  <g
     id="download">
    <rect
       class="box"
       x="160"
       y="190"
       width="300"
       height="60"
       rx="5"
       id="rect3" />
    <text
       class="text"
       x="310"
       y="210"
       id="text4">パラメータ読込 &amp;</text>
    <text
       class="text"
       x="310"
       y="230"
       id="text5">実行/入力ファイル ダウンロード</text>
  </g>
  <g
     id="download_ok">
    <path
       class="diamond"
       d="M 310 280 l 120 50 l -120 50 l -120 -50 z"
       id="path5" />
    <text
       class="text"
       x="310"
       y="330"
       id="text6">ダウンロード成功?</text>
  </g>
  <g
     id="exec">
    <rect
       class="box"
       x="190"
       y="410"
       width="240"
       height="50"
       rx="5"
       id="rect6" />
    <text
       class="text"
       x="310"
       y="435"
       id="text7">ユーザー定義スクリプト実行</text>
  </g>
  <g
     id="exec_ok">
    <path
       class="diamond"
       d="M 310 490 l 120 50 l -120 50 l -120 -50 z"
       id="path7" />
    <text
       class="text"
       x="310"
       y="530"
       id="text8">実行成功?</text>
    <text
       class="text"
       x="310"
       y="550"
       id="text9">(Exit Code 0)</text>
  </g>
  <g
     id="msg_success">
    <rect
       class="box"
       x="400"
       y="620"
       width="180"
       height="50"
       rx="5"
       id="rect9" />
    <text
       class="text"
       x="490"
       y="645"
       id="text10">「成功」メッセージ設定</text>
  </g>
  <g
     id="msg_fail">
    <rect
       class="box"
       x="40"
       y="620"
       width="180"
       height="50"
       rx="5"
       id="rect10" />
    <text
       class="text"
       x="130"
       y="645"
       id="text11">「失敗」メッセージ設定</text>
  </g>
  <g
     id="upload_notify">
    <rect
       class="box"
       x="160"
       y="730"
       width="300"
       height="60"
       rx="5"
       id="rect11" />
    <text
       class="text"
       x="310"
       y="750"
       id="text12">成果物アップロード &amp;</text>
    <text
       class="text"
       x="310"
       y="770"
       id="text13">結果を通知 (SNS/SES)</text>
  </g>
  <g
     id="shutdown">
    <rect
       class="box"
       x="190"
       y="820"
       width="240"
       height="50"
       rx="5"
       id="rect13" />
    <text
       class="text"
       x="310"
       y="845"
       id="text14">インスタンス自己終了</text>
  </g>
  <g
     id="end"
     transform="translate(0,24.194757)">
    <ellipse
       class="oval"
       cx="310"
       cy="910"
       rx="70"
       ry="30"
       id="ellipse14" />
    <text
       class="text"
       x="310"
       y="910"
       id="text15">終了</text>
  </g>
  <!-- Connectors -->
  <path
